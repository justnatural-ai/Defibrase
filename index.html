<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>降纤酶临床决策支持系统 · JUSTNATURAL</title>
<style>
:root{
  --bg:#F5F6F8;--card:#FFFFFF;--text:#1D1D1F;--text2:#6E6E73;--text3:#8E8E93;
  --line:#E5E5EA;--primary:#0A6CFF;--primary-soft:#E8F0FF;
  --green:#34C759;--green-soft:#E8F9ED;--amber:#FF9500;--amber-soft:#FFF4E0;
  --red:#FF3B30;--red-soft:#FFEBEA;
  --radius:14px;--shadow:0 1px 3px rgba(0,0,0,.04),0 4px 16px rgba(0,0,0,.04);
}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html,body{background:#E8E8ED;font-family:-apple-system,BlinkMacSystemFont,"SF Pro Display","PingFang SC","Helvetica Neue",sans-serif;color:var(--text);line-height:1.5}
body{min-height:100vh;display:flex;justify-content:center;padding:20px 0}
.phone{width:100%;max-width:420px;background:var(--bg);min-height:calc(100vh - 40px);border-radius:28px;overflow:hidden;box-shadow:0 20px 60px rgba(0,0,0,.15);position:relative;display:flex;flex-direction:column}
.statusbar{height:44px;display:flex;align-items:center;justify-content:space-between;padding:0 24px;font-size:14px;font-weight:600;flex-shrink:0}
.statusbar .time{font-variant-numeric:tabular-nums}
.content{flex:1;overflow-y:auto;padding:0 20px 100px;-webkit-overflow-scrolling:touch}
.content::-webkit-scrollbar{display:none}
.tabbar{position:absolute;bottom:0;left:0;right:0;height:83px;background:rgba(255,255,255,.95);backdrop-filter:blur(20px);border-top:1px solid var(--line);display:flex;padding-bottom:20px}
.tab{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;font-size:10px;color:var(--text3);cursor:pointer}
.tab svg{width:24px;height:24px}
.tab.active{color:var(--primary)}
.btn{display:block;width:100%;padding:15px;border-radius:14px;border:none;font-size:16px;font-weight:600;cursor:pointer;text-align:center;transition:opacity .15s}
.btn-primary{background:var(--primary);color:#fff}
.btn-primary:active{opacity:.85}
.btn-primary:disabled{background:#B0B0B5;cursor:not-allowed}
.btn-ghost{background:transparent;color:var(--primary);border:1px solid var(--primary)}
.card{background:var(--card);border-radius:var(--radius);padding:18px;margin-bottom:12px;box-shadow:var(--shadow)}
.h1{font-size:28px;font-weight:700;letter-spacing:-.5px;line-height:1.2}
.h2{font-size:20px;font-weight:700;letter-spacing:-.3px;margin-bottom:8px}
.h3{font-size:16px;font-weight:600;margin-bottom:6px}
.muted{color:var(--text2);font-size:13px}
.small{font-size:12px;color:var(--text3)}
.tag{display:inline-block;padding:3px 8px;border-radius:6px;font-size:11px;font-weight:600}
.tag-green{background:var(--green-soft);color:#1D8A3E}
.tag-amber{background:var(--amber-soft);color:#B25000}
.tag-red{background:var(--red-soft);color:#D70015}
.tag-blue{background:var(--primary-soft);color:var(--primary)}
.brand{padding:24px 0 8px}
.hero{padding:16px 0 20px}
.hero .h1{margin-bottom:10px}
.hero p{color:var(--text2);font-size:14px;line-height:1.6}
.mech{display:flex;align-items:center;gap:8px;margin:14px 0}
.mech-step{flex:1;background:var(--card);border-radius:12px;padding:12px 8px;text-align:center;box-shadow:var(--shadow)}
.mech-step .icon{font-size:22px;margin-bottom:6px}
.mech-step .t{font-size:11px;font-weight:600;line-height:1.3}
.mech-step .d{font-size:10px;color:var(--text3);margin-top:3px}
.mech-arrow{color:var(--text3);font-size:16px;flex-shrink:0}
.stat-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin:14px 0}
.stat{background:var(--card);border-radius:12px;padding:14px;box-shadow:var(--shadow)}
.stat .num{font-size:24px;font-weight:700;color:var(--primary);letter-spacing:-.5px}
.stat .lbl{font-size:11px;color:var(--text2);margin-top:2px;line-height:1.4}
.disclaimer{background:#FFF8E6;border-left:3px solid var(--amber);padding:12px;border-radius:8px;font-size:12px;color:#7A5C00;line-height:1.6;margin:16px 0}
.navbar{display:flex;align-items:center;gap:12px;padding:12px 0 16px}
.back{width:32px;height:32px;border-radius:50%;background:#fff;display:flex;align-items:center;justify-content:center;cursor:pointer;border:none;box-shadow:var(--shadow);flex-shrink:0}
.back svg{width:10px;height:16px}
.nav-title{font-size:17px;font-weight:600}
.section-title{font-size:13px;font-weight:600;color:var(--text3);letter-spacing:.5px;margin:18px 0 10px;padding:0 4px}
.progress{display:flex;gap:4px;margin:12px 0}
.p-dot{flex:1;height:4px;border-radius:2px;background:var(--line)}
.p-dot.done{background:var(--primary)}
.ind-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:14px}
.ind-card{background:var(--card);border-radius:14px;padding:16px 12px;box-shadow:var(--shadow);cursor:pointer;border:2px solid transparent;transition:all .15s}
.ind-card.selected{border-color:var(--primary);background:var(--primary-soft)}
.ind-card .ic{font-size:26px;margin-bottom:8px}
.ind-card .nm{font-size:13px;font-weight:600;line-height:1.3;margin-bottom:4px}
.q-item{background:var(--card);border-radius:12px;padding:14px 16px;margin-bottom:10px;box-shadow:var(--shadow);display:flex;justify-content:space-between;align-items:center;gap:10px}
.q-item .qt{font-size:14px;flex:1;line-height:1.4}
.q-item .opts{display:flex;gap:6px;flex-shrink:0}
.opt{padding:7px 14px;border-radius:8px;font-size:13px;font-weight:600;cursor:pointer;border:1.5px solid var(--line);background:#fff;color:var(--text2)}
.opt.yes{background:var(--red);color:#fff;border-color:var(--red)}
.opt.no{background:var(--green);color:#fff;border-color:var(--green)}
.lab-row{display:flex;justify-content:space-between;align-items:center;padding:12px 0;border-bottom:1px solid var(--line)}
.lab-row:last-child{border-bottom:none}
.lab-name{font-size:14px}
.lab-ref{font-size:11px;color:var(--text3)}
.lab-input{width:110px;padding:8px 10px;border:1.5px solid var(--line);border-radius:8px;font-size:15px;text-align:right;font-weight:600;font-variant-numeric:tabular-nums;outline:none}
.lab-input:focus{border-color:var(--primary)}
.lab-unit{font-size:11px;color:var(--text3);margin-left:4px}
.field{margin-bottom:14px}
.field label{display:block;font-size:13px;font-weight:600;margin-bottom:6px;color:var(--text2)}
.field input{width:100%;padding:12px;border:1.5px solid var(--line);border-radius:10px;font-size:16px;outline:none}
.field input:focus{border-color:var(--primary)}
.day-row{display:flex;gap:12px;padding:12px 0;border-bottom:1px solid var(--line);align-items:flex-start}
.day-row:last-child{border-bottom:none}
.day-badge{width:44px;height:44px;border-radius:10px;background:var(--primary-soft);color:var(--primary);display:flex;flex-direction:column;align-items:center;justify-content:center;flex-shrink:0;font-weight:700}
.day-badge .d{font-size:9px;font-weight:500;opacity:.7}
.day-badge .n{font-size:14px}
.day-info{flex:1}
.day-dose{font-size:15px;font-weight:700}
.day-meta{font-size:12px;color:var(--text2);margin-top:2px;line-height:1.5}
.sop-level{border-radius:14px;padding:16px;margin-bottom:12px;cursor:pointer}
.sop-green{background:var(--green-soft);border:1.5px solid #7EDB9B}
.sop-amber{background:var(--amber-soft);border:1.5px solid #FFC466}
.sop-red{background:var(--red-soft);border:1.5px solid #FF8A82}
.sop-level .lt{font-size:15px;font-weight:700;margin-bottom:4px}
.sop-level .ld{font-size:12px;opacity:.8;line-height:1.5}
.sop-steps{background:var(--card);border-radius:14px;padding:18px;margin-top:12px;box-shadow:var(--shadow)}
.sop-step{display:flex;gap:12px;padding:10px 0;border-bottom:1px solid var(--line)}
.sop-step:last-child{border-bottom:none}
.sop-num{width:24px;height:24px;border-radius:50%;background:var(--primary);color:#fff;font-size:12px;font-weight:700;display:flex;align-items:center;justify-content:center;flex-shrink:0}
.sop-txt{font-size:13px;line-height:1.5;flex:1}
.fab{position:absolute;right:16px;bottom:100px;width:56px;height:56px;border-radius:50%;background:var(--red);color:#fff;border:none;box-shadow:0 4px 16px rgba(255,59,48,.4);font-size:22px;cursor:pointer;z-index:50;display:flex;align-items:center;justify-content:center}
.toast{position:fixed;top:60px;left:50%;transform:translateX(-50%) translateY(-100px);background:rgba(0,0,0,.8);color:#fff;padding:12px 20px;border-radius:12px;font-size:14px;z-index:100;transition:transform .3s;max-width:320px;text-align:center}
.toast.show{transform:translateX(-50%) translateY(0)}
/* 患者列表 */
.pt-item{background:var(--card);border-radius:14px;padding:14px 16px;margin-bottom:10px;box-shadow:var(--shadow);cursor:pointer;display:flex;justify-content:space-between;align-items:center}
.pt-item:active{opacity:.8}
.pt-name{font-size:15px;font-weight:600}
.pt-meta{font-size:12px;color:var(--text3);margin-top:3px}
.pt-fib{text-align:right}
.pt-fib .v{font-size:18px;font-weight:700;color:var(--primary)}
.pt-fib .l{font-size:10px;color:var(--text3)}
.timeline{position:relative;padding-left:20px}
.timeline::before{content:'';position:absolute;left:6px;top:8px;bottom:8px;width:2px;background:var(--line)}
.tl-item{position:relative;padding:10px 0 10px 14px}
.tl-item::before{content:'';position:absolute;left:-18px;top:16px;width:10px;height:10px;border-radius:50%;background:var(--primary);border:2px solid #fff;box-shadow:0 0 0 2px var(--primary-soft)}
.tl-time{font-size:11px;color:var(--text3)}
.tl-txt{font-size:13px;margin-top:2px}
.empty{text-align:center;padding:40px 20px;color:var(--text3)}
.empty .ic{font-size:48px;margin-bottom:12px}
</style>
</head>
<body>
<div class="phone">
  <div class="statusbar"><span class="time">9:41</span></div>
  <div class="content" id="view"></div>
  <button class="fab" onclick="showSOP()">🚨</button>
  <div class="tabbar">
    <div class="tab" data-tab="home" onclick="go('home')">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M3 10.5L12 3l9 7.5V20a1 1 0 01-1 1h-5v-7h-6v7H4a1 1 0 01-1-1v-9.5z"/></svg>首页
    </div>
    <div class="tab" data-tab="patients" onclick="go('patients')">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M17 21v-2a4 4 0 00-4-4H5a4 4 0 00-4 4v2"/><circle cx="9" cy="7" r="4"/><path d="M23 21v-2a4 4 0 00-3-3.87"/><path d="M16 3.13a4 4 0 010 7.75"/></svg>我的患者
    </div>
    <div class="tab" data-tab="new" onclick="startNew()">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 5v14M5 12h14"/></svg>新建处方
    </div>
  </div>
</div>
<div class="toast" id="toast"></div>

<script>
/* ============ 持久化层 ============ */
const LS_KEY='jn_defibrase_patients_v1';
function loadPatients(){try{return JSON.parse(localStorage.getItem(LS_KEY))||[]}catch(e){return[]}}
function savePatients(p){localStorage.setItem(LS_KEY,JSON.stringify(p))}

/* ============ 运行时状态 ============ */
const S={
  view:'home',
  patients:loadPatients(),
  currentId:null,
  draft:{name:'',mrn:'',age:'',indication:null,contra:{},labs:{fibrinogen:'',pt:'',aptt:'',tt:'',plt:'',alt:'',cr:''}},
  nextFib:''
};

function currentPatient(){return S.patients.find(p=>p.id===S.currentId)}

/* ============ 数据 ============ */
const INDICATIONS=[
  {id:'stroke',ic:'🧠',nm:'急性脑梗死 / TIA',ev:'证据强',cls:'green'},

  {id:'hyper',ic:'🩸',nm:'高粘 / 血栓前状态',ev:'证据中等',cls:'amber'},
  {id:'health',ic:'🚫',nm:'保健性定期输液',ev:'禁用',cls:'red'},
];
const CONTRA=[
  '有脑出血/消化道出血/咯血史','术后2周内','有活动性出血',
  '正在服用阿司匹林','正在服用氯吡格雷/替格瑞洛','正在服用华法林/利伐沙班',
  '正在使用肝素类抗凝','正在使用氨甲环酸等抗纤溶药',
  'ALT/AST > 3倍上限','肌酐 > 265 μmol/L','对右旋糖酐/聚山梨酯80过敏'
];
const PLAN={
  stroke:[{d:'Day 1',n:'首剂',dose:'10 U',meta:'NS 250 mL 静滴 ≥60 min · 发病6h内最佳'},{d:'Day 3',n:'维持',dose:'5 U',meta:'NS 250 mL 静滴 ≥60 min'},{d:'Day 5',n:'维持',dose:'5 U',meta:'NS 250 mL 静滴 ≥60 min · 疗程结束'}],
  deaf:[{d:'Day 1',n:'首剂',dose:'10 BU',meta:'NS 100 mL 静滴 ≥60 min'},{d:'Day 3',n:'维持',dose:'5 BU',meta:'每次给药前必须复查 Fib'},{d:'Day 5',n:'维持',dose:'5 BU',meta:'Fib <1.0 g/L 暂停'},{d:'Day 7',n:'维持',dose:'5 BU',meta:'联合激素+改善微循环'},{d:'Day 9',n:'维持',dose:'5 BU',meta:'共5次，疗程结束'}],
  dvt:[{d:'Day 1',n:'首剂',dose:'10 U',meta:'联合低分子肝素'},{d:'Day 2+',n:'维持',dose:'5 U',meta:'每日或隔日，根据DVT症状3–14天'}],
  angina:[{d:'Day 1–5',n:'疗程',dose:'10 U qd',meta:'仅作辅助，不替代双抗/他汀/介入'}],
  hyper:[{d:'Day 1',n:'首剂',dose:'10 U',meta:'基线 Fib 必须 >3.5 g/L 才考虑'},{d:'维持',n:'疗程',dose:'5–10 U qd/qod',meta:'2周一疗程'}]
};
const SOP_DATA={
  green:{t:'轻度出血',steps:['立即停止本次降纤酶输注','局部压迫止血 10–15 min','急查 Fib、PLT、PT、APTT','若 Fib >1.0 g/L：观察24h，下次给药前复查','若 Fib <1.0 g/L：暂停下一剂，24h后复查','记录于病历']},
  amber:{t:'中度出血',steps:['立即停药，建立两条静脉通路','急查 Fib、PLT、Hb、PT、APTT、D-dimer、血型','备血：红细胞2U + 新鲜冰冻血浆','Fib <1.0 g/L：冷沉淀 10–20 U/kg 或纤维蛋白原 1–2 g','停用一切抗血小板/抗凝药','找出血来源：胃镜/泌尿系超声/加压包扎','24h后复查 Fib，恢复需 >1.5 g/L']},
  red:{t:'重度出血',steps:['立即停药，呼叫抢救团队','ABC 支持','急查 Fib、PLT、Hb、凝血、血气；头颅CT','冷沉淀 10–20 U/kg + 纤维蛋白原 2 g 静推','PLT <50×10⁹/L 输血小板','消化道：PPI+内镜；颅内：神外会诊','禁止氨甲环酸','上报ADR，永久停用']}
};

/* ============ 路由 ============ */
function go(v){
  S.view=v;
  document.querySelectorAll('.tab').forEach(t=>t.classList.remove('active'));
  if(['home'].includes(v)) document.querySelector('[data-tab="home"]').classList.add('active');
  if(['patients','detail'].includes(v)) document.querySelector('[data-tab="patients"]').classList.add('active');
  render();window.scrollTo(0,0);
}
function startNew(){
  S.currentId=null;
  S.draft={name:'',mrn:'',age:'',indication:null,contra:{},labs:{fibrinogen:'',pt:'',aptt:'',tt:'',plt:'',alt:'',cr:''}};
  go('newpatient');
}
function render(){
  const v=document.getElementById('view');
  const map={home:viewHome,patients:viewPatients,newpatient:viewNewPatient,contra:viewContra,baseline:viewBaseline,plan:viewPlan,fib:viewFib,detail:viewDetail,sop:viewSop};
  v.innerHTML=(map[S.view]||viewHome)();
  window.scrollTo(0,0);
}

      <div style="padding:8px 10px;background:#F0F9F0;border-radius:8px;margin-bottom:6px">
        <b>🇯🇵 日本 · Kubo et al.</b> Defibrinogenation therapy for idiopathic sudden sensorineural hearing loss: double-blind RCT. <i>ORL J Otorhinolaryngol Relat Spec</i>. <b>突聋降纤治疗阳性对照</b>
      </div>
      <div style="padding:8px 10px;background:#F0F9F0;border-radius:8px;margin-bottom:6px">
        <b>🇯🇵 日本 · Tanahashi N, et al.</b> Effect of single IV batroxobin on erythrocyte aggregability in acute cerebral infarction. <i>Clin Hemorheol</i>. 1995;15:89-96. <b>10BU vs 5BU剂量探索</b>
      </div>
      <div style="padding:8px 10px;background:#FFF4E0;border-radius:8px;margin-bottom:6px">
        <b>🇷🇺 俄罗斯 · Gusev EI, et al.</b> Batroxobin in ischemic stroke in the carotid system: multicenter study. <i>Zh Nevrol Psikhiatr Im S S Korsakova</i>. 2006;106(8):31-34. <b>10BU d1,3,5 + 5BU d7,9方案来源</b>
      </div>
      <div style="padding:8px 10px;background:#FFF4E0;border-radius:8px;margin-bottom:6px">
        <b>🇩🇪 德国 · AAO-HNS / German Guideline</b> Sudden idiopathic sensorineural hearing loss guideline 2011. <b>将降纤维蛋白原列为流变学治疗主要方法</b>
      </div>
      <div style="padding:8px 10px;background:var(--primary-soft);border-radius:8px;margin-bottom:6px">
        <b>🇺🇸 美国 · Levy DE, et al.</b> Ancrod in acute ischemic stroke within 6 hours. <i>Stroke</i>. 2009;40:3796-3803. <b>n=500，6h窗阴性，界定时间窗</b>
      </div>
      <div style="padding:8px 10px;background:#E8F4FD;border-radius:8px;margin-bottom:6px">
        <b>🇨🇳 中国 · 多中心双盲RCT 2000</b> 国产降纤酶治疗急性脑梗死. <b>n=2244，发病6h内获益，Fib&lt;1.3g/L出血增加</b>
      </div>
      <div style="padding:8px 10px;background:#E8F4FD;border-radius:8px;margin-bottom:6px">
        <b>🇨🇳 中国 · Lyu J, et al.</b> Batroxobin beyond thrombolysis window: multicenter retrospective. <i>CNS Neurosci Ther</i>. 2024. <b>n=492，1年复发8.3% vs 17.2%</b>
      </div>
      <div style="padding:8px 10px;background:#E8F4FD;border-radius:8px;margin-bottom:6px">
        <b>🇨🇳 中国 · Lan D, et al.</b> Batroxobin in central and peripheral ischemic vascular diseases: systematic review. <i>Front Neurol</i>. 2021;12:716778. <b>62项研究，26项临床</b>
      </div>
      <div style="padding:8px 10px;background:#F5F5F5;border-radius:8px">
        <b>📘 指南</b>：中国急性缺血性脑卒中诊治指南2010/2014（中华神经科杂志）；突发性聋诊断和治疗指南2015（中华耳鼻咽喉头颈外科杂志）；German Sudden HL Guideline 2011
      </div>
    </div>
  </div>

  <div class="card">
    <div class="h3">数据来源数据库</div>
    <div style="margin-top:8px;font-size:12px;color:var(--text2);line-height:1.9">
      PubMed Central · Cochrane Library · JAMA Network · Stroke (AHA/ASA) · Frontiers · NMPA化学药品说明书（第五批）· CNKI中国知网 · 中国药物临床试验登记与信息公示平台 · 中华医学知识库
    </div>
  </div>
  <div class="card" style="background:#FAFAFA;text-align:center;padding:16px">
    <div class="small" style="color:var(--text3);margin-bottom:6px">联合出品</div>
    <div style="font-size:13px;font-weight:600;line-height:1.6">上海智沃生物科技有限公司</div>
    <div style="font-size:13px;font-weight:600;line-height:1.6;margin-top:2px">筑波大学生命科学研究所</div>
  </div>
  ${recent.length?`<div class="section-title">最近患者</div>${recent.map(ptItemHtml).join('')}`:''}
  <div class="disclaimer">⚠️ <b>免责声明</b>：处方药注射剂，须在有凝血监测条件的医疗机构内使用。患者档案存储于本机浏览器，不上传服务器。</div>
  <button class="btn btn-primary" onclick="startNew()">+ 新建处方</button>
  <div style="height:10px"></div>
  <button class="btn btn-ghost" onclick="go('patients')">查看全部患者（${S.patients.length}）</button>
  `;
}

function ptItemHtml(p){
  const lastLog=p.fibLogs&&p.fibLogs[p.fibLogs.length-1];
  const ind=INDICATIONS.find(i=>i.id===p.indication);
  return `<div class="pt-item" onclick="openPatient('${p.id}')">
    <div><div class="pt-name">${p.name||'未命名'} <span class="small">· ${p.age||'?'}岁</span></div>
    <div class="pt-meta">${ind?ind.nm:''} · ${p.mrn||'无ID'} · 共${p.fibLogs?p.fibLogs.length:0}次记录</div></div>
    <div class="pt-fib">${lastLog?`<div class="v">${lastLog.value}</div><div class="l">最近Fib g/L</div>`:'<div class="v" style="color:var(--text3)">—</div><div class="l">未给药</div>'}</div>
  </div>`;
}

/* ============ 患者列表 ============ */
function viewPatients(){
  return `<div class="navbar"><div class="back" onclick="go('home')"><svg viewBox="0 0 10 16" fill="none" stroke="currentColor" stroke-width="2"><path d="M8 1L1 8l7 7"/></svg></div><div class="nav-title">我的患者</div></div>
  <button class="btn btn-primary" style="margin-bottom:16px" onclick="startNew()">+ 新建处方</button>
  ${S.patients.length?S.patients.slice().reverse().map(ptItemHtml).join(''):`<div class="empty"><div class="ic">📋</div><div>暂无患者记录</div><div class="small" style="margin-top:6px">点击上方按钮开始第一例处方</div></div>`}
  `;
}

/* ============ 新建患者基本信息 ============ */
function viewNewPatient(){
  return `<div class="navbar"><div class="back" onclick="go('home')"><svg viewBox="0 0 10 16" fill="none" stroke="currentColor" stroke-width="2"><path d="M8 1L1 8l7 7"/></svg></div><div class="nav-title">新建处方</div></div>
  <div class="progress"><div class="p-dot done"></div><div class="p-dot"></div><div class="p-dot"></div><div class="p-dot"></div></div>
  <div class="card">
    <div class="field"><label>患者姓名</label><input id="f_name" placeholder="如：张三" value="${S.draft.name}"></div>
    <div class="field"><label>住院号 / 病历号</label><input id="f_mrn" placeholder="如：ZY20261026" value="${S.draft.mrn}"></div>
    <div class="field"><label>年龄</label><input id="f_age" type="number" placeholder="岁" value="${S.draft.age}"></div>
  </div>
  <div class="section-title">选择适应症</div>
  <div class="ind-grid">
    ${INDICATIONS.map(i=>`<div class="ind-card ${S.draft.indication===i.id?'selected':''}" onclick="pickInd('${i.id}')">
      <div class="ic">${i.ic}</div><div class="nm">${i.nm}</div><span class="tag tag-${i.cls}">${i.ev}</span></div>`).join('')}
  </div>
  <div style="height:20px"></div>
  <button class="btn btn-primary" id="nextNew" disabled onclick="saveDraft()">下一步：禁忌筛查</button>
  `;
}
function pickInd(id){
  if(id==='health'){toast('⚠️ 无适应症定期输注无循证依据，已禁止');return;}
  S.draft.indication=id;render();checkNewReady();
}
function saveDraftFields(){
  S.draft.name=document.getElementById('f_name').value;
  S.draft.mrn=document.getElementById('f_mrn').value;
  S.draft.age=document.getElementById('f_age').value;
}
function checkNewReady(){
  saveDraftFields();
  document.getElementById('nextNew').disabled=!(S.draft.name&&S.draft.age&&S.draft.indication);
}
function saveDraft(){
  saveDraftFields();
  if(!(S.draft.name&&S.draft.age&&S.draft.indication))return;
  const pt={id:'pt_'+Date.now(),name:S.draft.name,mrn:S.draft.mrn,age:parseInt(S.draft.age),indication:S.draft.indication,createdAt:new Date().toISOString(),labs:null,plan:null,fibLogs:[]};
  S.patients.push(pt);savePatients(S.patients);
  S.currentId=pt.id;
  go('contra');
}

/* ============ 禁忌 ============ */
function viewContra(){
  return `<div class="navbar"><div class="back" onclick="go('newpatient')"><svg viewBox="0 0 10 16" fill="none" stroke="currentColor" stroke-width="2"><path d="M8 1L1 8l7 7"/></svg></div><div class="nav-title">禁忌筛查</div></div>
  <div class="progress"><div class="p-dot done"></div><div class="p-dot done"></div><div class="p-dot"></div><div class="p-dot"></div></div>
  <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:12px">
    <div class="muted">任一项选"是"即终止。</div>
    <button class="btn btn-soft" style="width:auto;padding:8px 14px;font-size:13px" onclick="allNo()">✓ 一键全否</button>
  </div>
  ${CONTRA.map((q,idx)=>`<div class="q-item"><div class="qt">${q}</div><div class="opts">
    <div class="opt ${S.draft.contra[idx]==='yes'?'yes':''}" onclick="setContra(${idx},'yes')">是</div>
    <div class="opt ${S.draft.contra[idx]==='no'?'no':''}" onclick="setContra(${idx},'no')">否</div></div></div>`).join('')}
  <div style="height:20px"></div>
  <button class="btn btn-primary" id="contraNext" disabled onclick="go('baseline')">下一步：基线化验</button>`;
}
function setContra(idx,val){
  S.draft.contra[idx]=val;render();syncContraBtn();
}
function allNo(){
  CONTRA.forEach((_,i)=>S.draft.contra[i]='no');
  render();syncContraBtn();
  toast('已全部标记为"否"');
}
function syncContraBtn(){
  const btn=document.getElementById('contraNext');if(!btn)return;
  const yes=Object.values(S.draft.contra).filter(v=>v==='yes').length;
  const answered=Object.keys(S.draft.contra).length;
  if(yes>0){btn.disabled=true;btn.textContent='⛔ 存在禁忌，禁止开具';btn.style.background='var(--red)';}
  else if(answered>=CONTRA.length){btn.disabled=false;btn.textContent='通过，下一步';btn.style.background='var(--primary)';}
}

/* ============ 基线化验 ============ */
function viewBaseline(){
  const L=S.draft.labs;
  return `<div class="navbar"><div class="back" onclick="go('contra')"><svg viewBox="0 0 10 16" fill="none" stroke="currentColor" stroke-width="2"><path d="M8 1L1 8l7 7"/></svg></div><div class="nav-title">基线化验</div></div>
  <div class="progress"><div class="p-dot done"></div><div class="p-dot done"></div><div class="p-dot done"></div><div class="p-dot"></div></div>
  <div class="card">
    ${[
      ['fibrinogen','纤维蛋白原 Fib','g/L','0.01','参考 2.0–4.0 g/L · 必查'],
      ['pt','PT 凝血酶原时间','秒','0.1','参考 11–14 秒'],
      ['aptt','APTT','秒','0.1','参考 25–35 秒'],
      ['tt','TT 凝血酶时间','秒','0.1','参考 14–21 秒'],
      ['plt','血小板 PLT','×10⁹/L','','参考 125–350 ×10⁹/L'],
      ['alt','ALT','U/L','','参考 <40 U/L'],
      ['cr','肌酐 Cr','μmol/L','','参考 44–115 μmol/L']
    ].map(r=>{
      const [k,n,u,step,ref]=r;
      return `<div class="lab-row"><div><div class="lab-name">${n}</div><div class="lab-ref">${ref}</div></div><div><input class="lab-input" type="number" step="${step||1}" value="${L[k]||''}" onchange="S.draft.labs['${k}']=this.value"><span class="lab-unit">${u}</span></div></div>`;
    }).join('')}
  </div>
  <div style="height:20px"></div>
  <button class="btn btn-primary" onclick="genPlan()">生成方案并存档</button>`;
}
function genPlan(){
  if(!S.draft.labs.fibrinogen){toast('请先录入 Fib');return;}
  const fib=parseFloat(S.draft.labs.fibrinogen);
  if(fib<1.5){toast('基线 Fib 过低，不宜启动');return;}
  const pt=currentPatient();
  pt.labs={...S.draft.labs};
  pt.plan={createdAt:new Date().toISOString(),reduced:parseInt(pt.age)>=70};
  savePatients(S.patients);
  go('plan');
}

/* ============ 方案 ============ */
function viewPlan(){
  const pt=currentPatient();if(!pt)return '';
  const plan=PLAN[pt.indication]||PLAN.hyper;
  const fib=parseFloat(pt.labs.fibrinogen);
  return `<div class="navbar"><div class="back" onclick="go('detail')"><svg viewBox="0 0 10 16" fill="none" stroke="currentColor" stroke-width="2"><path d="M8 1L1 8l7 7"/></svg></div><div class="nav-title">方案 · ${pt.name}</div></div>
  <div class="card" style="background:var(--green-soft)">
    <div style="display:flex;justify-content:space-between;align-items:center">
      <div><div class="h3" style="margin:0">✅ 可启动</div>
      <div class="small" style="margin-top:4px">基线 Fib ${fib.toFixed(2)} g/L</div></div>
      ${pt.plan.reduced?'<span class="tag tag-amber">≥70岁 首剂减半</span>':'<span class="tag tag-green">标准剂量</span>'}
    </div>
  </div>
  <div class="card"><div class="h3">📋 给药日程</div><div style="height:8px"></div>
    ${plan.map((d,i)=>{
      const dose = (pt.plan.reduced && i===0) ? d.dose.replace('10','5') : d.dose;
      return `<div class="day-row">
      <div class="day-badge"><span class="d">${d.d}</span><span class="n">${dose.replace(' BU','').replace(' U','')}</span></div>
      <div class="day-info"><div class="day-dose">${dose}</div><div class="day-meta">${d.meta}</div></div></div>`;
    }).join('')}
  </div>
  <div class="card"><div class="h3">🎯 Fib目标 1.0–1.5 g/L</div>
    <div class="muted" style="margin-top:6px;line-height:1.8">每次给药前复查：<br>· <b style="color:var(--red)">&lt;1.0</b> 暂停 · 24h后复查<br>· <b style="color:var(--amber)">1.0–1.5</b> 给维持量<br>· <b style="color:var(--green)">&gt;1.5</b> 给全量</div></div>
  <div style="height:20px"></div>
  <button class="btn btn-primary" onclick="go('fib')">+ 录入下一次给药前Fib</button>
  <div style="height:10px"></div>
  <button class="btn btn-ghost" onclick="go('detail')">返回患者档案</button>`;
}

/* ============ Fib硬卡点 ============ */
function viewFib(){
  return `<div class="navbar"><div class="back" onclick="go('plan')"><svg viewBox="0 0 10 16" fill="none" stroke="currentColor" stroke-width="2"><path d="M8 1L1 8l7 7"/></svg></div><div class="nav-title">给药前Fib复核</div></div>
  <div class="card" style="text-align:center;padding:30px 20px"><div style="font-size:48px">🩸</div><div class="h2" style="margin-top:12px">录入最新 Fib</div><div class="muted">未录入无法解锁给药</div></div>
  <div class="card"><input class="lab-input" type="number" step="0.01" style="width:100%;font-size:28px;text-align:center;padding:16px" placeholder="0.00" value="${S.nextFib}" oninput="S.nextFib=this.value;updFib()">
  <div style="text-align:center;margin-top:6px;color:var(--text3)">g/L</div></div>
  <div id="fv" class="card" style="display:none"></div>
  <div style="height:20px"></div>
  <button class="btn btn-primary" id="fb" disabled onclick="commitFib()">解锁给药</button>`;
}
function updFib(){
  const v=parseFloat(S.nextFib);const b=document.getElementById('fb');const f=document.getElementById('fv');
  if(isNaN(v)){f.style.display='none';b.disabled=true;return;}
  f.style.display='block';
  if(v<1.0){f.style.background='var(--red-soft)';f.innerHTML='<div style="color:var(--red);font-weight:700">⛔ 暂停给药</div><div class="small" style="margin-top:4px">Fib <1.0，24h后复查</div>';b.disabled=true;b.style.background='var(--text3)';b.textContent='给药已锁定';}
  else if(v<1.5){f.style.background='var(--amber-soft)';f.innerHTML='<div style="color:var(--amber);font-weight:700">⚠️ 仅给维持量5U</div>';b.disabled=false;b.style.background='var(--primary)';b.textContent='解锁：给5 U';}
  else{f.style.background='var(--green-soft)';f.innerHTML='<div style="color:var(--green);font-weight:700">✅ 可给全量</div>';b.disabled=false;b.style.background='var(--primary)';b.textContent='解锁给药';}
}
function commitFib(){
  const v=parseFloat(S.nextFib);const pt=currentPatient();if(!pt)return;
  pt.fibLogs.push({time:new Date().toISOString(),value:v,action:v<1.0?'暂停':v<1.5?'给5U':'全量'});
  savePatients(S.patients);
  S.nextFib='';
  toast('✅ 记录已保存到患者档案');
  go('detail');
}

/* ============ 患者详情 ============ */
function viewDetail(){
  const pt=currentPatient();if(!pt)return '<div class="empty">患者不存在</div>';
  const ind=INDICATIONS.find(i=>i.id===pt.indication);
  return `<div class="navbar"><div class="back" onclick="go('patients')"><svg viewBox="0 0 10 16" fill="none" stroke="currentColor" stroke-width="2"><path d="M8 1L1 8l7 7"/></svg></div><div class="nav-title">${pt.name}</div></div>
  <div class="card"><div style="display:flex;justify-content:space-between;align-items:flex-start">
    <div><div class="h2" style="margin:0">${pt.name}</div>
    <div class="muted" style="margin-top:4px">${pt.age}岁 · ${pt.mrn||'无住院号'}</div>
    <div style="margin-top:8px"><span class="tag tag-blue">${ind?ind.nm:''}</span></div></div>
    <button class="btn btn-ghost" style="width:auto;padding:8px 14px;font-size:13px" onclick="if(confirm('删除该患者记录？')){delPt('${pt.id}')}">删除</button>
  </div></div>
  ${pt.labs?`<div class="card"><div class="h3">基线化验</div>
    <div class="muted" style="line-height:2">Fib ${pt.labs.fibrinogen} g/L · PLT ${pt.labs.plt} · ALT ${pt.labs.alt} · Cr ${pt.labs.cr}</div></div>`:''}
  <div class="section-title">Fib给药时间线（${pt.fibLogs.length}次）</div>
  <div class="card"><div class="timeline">
    ${pt.fibLogs.length?pt.fibLogs.map(l=>`<div class="tl-item"><div class="tl-time">${new Date(l.time).toLocaleString('zh-CN')}</div>
      <div class="tl-txt">Fib <b>${l.value}</b> g/L → <span class="tag ${l.action==='暂停'?'tag-red':l.action==='给5U'?'tag-amber':'tag-green'}">${l.action}</span></div></div>`).join(''):'<div class="small" style="padding:8px 0">暂无给药记录</div>'}
  </div></div>
  <div style="height:20px"></div>
  <button class="btn btn-primary" onclick="go('fib')">+ 录入下一次Fib</button>
  <div style="height:10px"></div>
  <button class="btn btn-ghost" onclick="go('plan')">查看当前方案</button>`;
}
function delPt(id){S.patients=S.patients.filter(p=>p.id!==id);savePatients(S.patients);S.currentId=null;go('patients');}
function openPatient(id){S.currentId=id;go('detail');}

/* ============ SOP ============ */
function viewSop(){return `<div class="navbar"><div class="back" onclick="go('home')"><svg viewBox="0 0 10 16" fill="none" stroke="currentColor" stroke-width="2"><path d="M8 1L1 8l7 7"/></svg></div><div class="nav-title">出血急救SOP</div></div>
  <div class="muted" style="margin-bottom:12px">点击分级查看处置流程。</div>
  ${Object.entries(SOP_DATA).map(([k,d])=>`<div class="sop-level sop-${k}" onclick="showSopLv('${k}')">
    <div class="lt">${k==='green'?'🟢':k==='amber'?'🟡':'🔴'} ${d.t}</div></div>`).join('')}
  <div id="sd"></div>`;}
function showSOP(){go('sop');}
function showSopLv(k){
  const d=SOP_DATA[k];
  document.getElementById('sd').innerHTML=`<div class="sop-steps"><div class="h3">${d.t} · 处置步骤</div><div style="height:8px"></div>
    ${d.steps.map((s,i)=>`<div class="sop-step"><div class="sop-num">${i+1}</div><div class="sop-txt">${s}</div></div>`).join('')}
    <div style="height:12px"></div><button class="btn btn-primary" onclick="toast('已记录')">✅ 已执行</button></div>`;
  document.getElementById('sd').scrollIntoView({behavior:'smooth'});
}

function toast(t){const e=document.getElementById('toast');e.textContent=t;e.classList.add('show');setTimeout(()=>e.classList.remove('show'),2200);}
document.addEventListener('input',e=>{if(['f_name','f_mrn','f_age'].includes(e.target.id))checkNewReady();});
render();
</script>
</body>
</html>
